services:
  postgres:
    image: postgres:16.4
    volumes:
      - postgres:/data/postgres
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - common
    environment:
      PGDATA: /data/postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

networks:
  common:
    driver: bridge

volumes:
  postgres:
